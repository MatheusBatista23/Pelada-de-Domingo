<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<!-- ESSENCIAL PRA MOBILE -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Montador de Times</title>

<style>
body {
  font-family: Arial;
  background: #0f172a;
  color: white;
  margin: 0;
  padding: 15px;
}

.container {
  max-width: 500px;
  margin: auto;
}

h1 {
  text-align: center;
  font-size: 22px;
}

input, select, button {
  width: 100%;
  padding: 12px;
  margin-top: 8px;
  border-radius: 8px;
  border: none;
  font-size: 16px;
}

button {
  background: #22c55e;
  color: white;
  font-weight: bold;
}

.danger {
  background: #ef4444;
}

.actions button {
  margin-top: 10px;
}

.jogador {
  background: #1e293b;
  padding: 10px;
  margin-top: 6px;
  border-radius: 8px;
  display: flex;
  justify-content: space-between;
}

.times {
  margin-top: 15px;
}

.time {
  background: #1e293b;
  padding: 10px;
  border-radius: 8px;
  margin-top: 10px;
}

.time h3 {
  margin-bottom: 5px;
  border-bottom: 1px solid #334155;
}

.modal {
  display: none;
  position: fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background: rgba(0,0,0,0.7);
}

.modal-content {
  background: #1e293b;
  margin: 50px auto;
  padding: 20px;
  width: 90%;
  border-radius: 10px;
}

textarea {
  width: 100%;
  height: 200px;
  margin-top: 10px;
}
</style>
</head>

<body>

<div class="container">
  <h1>⚽ Montador de Times</h1>

  <input type="text" id="nome" placeholder="Nome do jogador">

  <select id="nivel">
    <option value="1">Nível 1</option>
    <option value="2">Nível 2</option>
    <option value="3">Nível 3</option>
  </select>

  <button onclick="addJogador()">Adicionar</button>

  <input type="number" id="numTimes" value="2" placeholder="Times">
  <input type="number" id="porTime" value="5" placeholder="Jogadores por time">

  <div class="actions">
    <button onclick="sortear()">🎲 Sortear</button>
    <button class="danger" onclick="limparJogadores()">🗑️ Limpar</button>
    <button onclick="gerarTexto()">📋 Gerar Texto</button>
  </div>

  <h3>Jogadores (<span id="totalJogadores">0</span>)</h3>
  <div id="listaJogadores"></div>

  <h3>Times</h3>
  <div id="times" class="times"></div>
</div>

<!-- MODAL -->
<div id="modal" class="modal">
  <div class="modal-content">
    <h3>Times Gerados</h3>
    <textarea id="textoTimes"></textarea>
    <button onclick="copiarTexto()">📋 Copiar</button>
    <button onclick="fecharModal()">Fechar</button>
  </div>
</div>

<script>
let jogadores = [];
let ultimoSorteio = [];

// STORAGE
function salvarJogadores() {
  localStorage.setItem("jogadores", JSON.stringify(jogadores));
}

function carregarJogadores() {
  const dados = localStorage.getItem("jogadores");
  if (dados) jogadores = JSON.parse(dados);
  renderJogadores();
}

// ADD
function addJogador() {
  const nome = document.getElementById("nome").value.trim();
  const nivel = parseInt(document.getElementById("nivel").value);

  if (!nome) return alert("Digite um nome");

  jogadores.push({ nome, nivel });
  salvarJogadores();

  document.getElementById("nome").value = "";
  renderJogadores();
}

// REMOVE
function remover(i) {
  jogadores.splice(i,1);
  salvarJogadores();
  renderJogadores();
}

// CLEAR
function limparJogadores() {
  if (!confirm("Apagar tudo?")) return;
  jogadores = [];
  salvarJogadores();
  renderJogadores();
  document.getElementById("times").innerHTML="";
}

// RENDER
function renderJogadores() {
  const lista = document.getElementById("listaJogadores");
  lista.innerHTML = "";

  jogadores.forEach((j,i)=>{
    lista.innerHTML += `
      <div class="jogador">
        ${j.nome} (${j.nivel})
        <button onclick="remover(${i})">❌</button>
      </div>
    `;
  });

  document.getElementById("totalJogadores").innerText = jogadores.length;
}

// SORT
function sortear() {
  const numTimes = parseInt(document.getElementById("numTimes").value);

  let lista = [...jogadores].sort((a,b)=>b.nivel-a.nivel);
  let times = Array.from({length:numTimes},()=>[]);

  let i=0, dir=1;

  lista.forEach(j=>{
    times[i].push(j);
    i+=dir;
    if(i===numTimes){dir=-1;i=numTimes-1;}
    else if(i<0){dir=1;i=0;}
  });

  ultimoSorteio = times;
  renderTimes(times);
}

// RENDER TIMES
function renderTimes(times){
  const div = document.getElementById("times");
  div.innerHTML="";

  times.forEach((t,i)=>{
    div.innerHTML+=`
      <div class="time">
        <h3>Time ${i+1}</h3>
        ${t.map(j=>`<p>${j.nome}</p>`).join("")}
      </div>
    `;
  });
}

// TEXTO
function gerarTexto(){
  if(!ultimoSorteio.length) return alert("Sorteie primeiro!");

  let txt="";
  ultimoSorteio.forEach((t,i)=>{
    txt+=`Time ${i+1}:\n`;
    t.forEach(j=>txt+=j.nome+"\n");
    txt+="\n";
  });

  document.getElementById("textoTimes").value = txt;
  document.getElementById("modal").style.display="block";
}

// COPIAR
function copiarTexto(){
  const area = document.getElementById("textoTimes");
  area.select();
  document.execCommand("copy");
  alert("Copiado!");
}

// MODAL
function fecharModal(){
  document.getElementById("modal").style.display="none";
}

// INIT
window.onload = carregarJogadores;
</script>

</body>
</html>
