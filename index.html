<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Montador de Times Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #1e252b;
            --bg-card: #2d3640;
            --primary: #22c55e;
            --danger: #ef4444;
            --text-main: #ffffff;
            --text-muted: #a0aec0;
            --border: #3f4a56;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg-body);
            color: var(--text-main);
            padding: 20px 15px;
        }

        .container { max-width: 450px; margin: auto; }

        header { text-align: center; margin-bottom: 25px; }

        .card {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .card-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 15px;
            font-weight: 600;
        }

        label { display: block; font-size: 0.9rem; margin-bottom: 5px; color: var(--text-muted); }

        input, select {
            width: 100%;
            padding: 12px;
            background: #1e252b;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: white;
            font-size: 16px;
            margin-bottom: 15px;
        }

        /* Estilo para a Flag de Habilidade */
        .skill-toggle {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            background: #1e252b;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .skill-toggle input[type="checkbox"] {
            width: 20px;
            height: 20px;
            margin: 0;
            cursor: pointer;
        }

        .skill-toggle span { font-size: 0.9rem; color: var(--text-main); }

        .grid-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

        button {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-add { background: var(--primary); color: white; }
        .btn-sortear { background: var(--primary); color: white; margin-bottom: 10px; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-secondary { background: #4a5568; color: white; margin-top: 10px; }

        .action-row { display: grid; grid-template-columns: 1.0fr 1fr; gap: 10px; margin-bottom: 10px; }

        .lista-container { max-height: 300px; overflow-y: auto; }
        .jogador-item {
            background: #1e252b;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid var(--primary);
        }

        .btn-del { background: none; color: var(--danger); width: auto; font-size: 1.2rem; }

        .time-box {
            background: #1e252b;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            border: 1px solid var(--border);
        }

        .modal {
            display: none; position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.85); z-index: 100;
        }
        .modal-content {
            background: var(--bg-card); margin: 15% auto; padding: 25px;
            width: 90%; max-width: 400px; border-radius: 15px;
        }
        textarea {
            width: 100%; height: 200px; background: #1e252b; color: white; border-radius: 8px; padding: 10px; margin: 15px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>⚽ Montador de Times</h1>
    </header>

    <div class="card">
        <p class="card-title">Adicionar Jogador</p>
        <input type="text" id="nome" placeholder="Nome do Jogador">
        
        <!-- FLAG DE HABILIDADE -->
        <label class="skill-toggle">
            <input type="checkbox" id="usarNivel" onchange="toggleNivelSelect()">
            <span>Definir nível de habilidade?</span>
        </label>

        <div id="campoNivel" style="display: none;">
            <label>Nível</label>
            <select id="nivel">
                <option value="1">⭐ Nível 1</option>
                <option value="2">⭐⭐ Nível 2</option>
                <option value="3">⭐⭐⭐ Nível 3</option>
            </select>
        </div>

        <button class="btn-add" onclick="addJogador()">Adicionar Jogador</button>
    </div>

    <div class="card">
        <p class="card-title">Configurar Sorteio</p>
        <div class="grid-inputs">
            <div>
                <label>Qtd. Times</label>
                <input type="number" id="numTimes" value="2">
            </div>
            <div>
                <label>Jog. por Time</label>
                <input type="number" id="porTime" value="5">
            </div>
        </div>
        <div class="action-row">
            <button class="btn-sortear" onclick="sortear()">🎲 Sortear</button>
            <button class="btn-danger" onclick="limparJogadores()">🗑️ Limpar</button>
        </div>
        <button class="btn-secondary" onclick="gerarTexto()">📋 Gerar Texto</button>
    </div>

    <div class="card">
        <p class="card-title">Jogadores (<span id="totalJogadores">0</span>)</p>
        <div id="listaJogadores" class="lista-container"></div>
    </div>

    <div class="card">
        <p class="card-title">Times Formados</p>
        <div id="times"></div>
    </div>
</div>

<div id="modal" class="modal">
    <div class="modal-content">
        <h3>Lista para Copiar</h3>
        <textarea id="textoTimes" readonly></textarea>
        <button class="btn-add" onclick="copiarTexto()">Copiar</button>
        <button class="btn-secondary" onclick="fecharModal()">Fechar</button>
    </div>
</div>

<script>
    let jogadores = [];
    let ultimoSorteio = [];

    // Mostrar/Esconder seletor de nível
    function toggleNivelSelect() {
        const checkbox = document.getElementById("usarNivel");
        const campo = document.getElementById("campoNivel");
        campo.style.display = checkbox.checked ? "block" : "none";
    }

    function salvarJogadores() {
        localStorage.setItem("jogadores", JSON.stringify(jogadores));
    }

    function carregarJogadores() {
        const dados = localStorage.getItem("jogadores");
        if (dados) jogadores = JSON.parse(dados);
        renderJogadores();
    }

    function addJogador() {
        const nomeInput = document.getElementById("nome");
        const nome = nomeInput.value.trim();
        const usarNivel = document.getElementById("usarNivel").checked;
        
        // Se a flag estiver desmarcada, o nível padrão é 1
        const nivel = usarNivel ? parseInt(document.getElementById("nivel").value) : 1;

        if (!nome) return alert("Digite o nome.");

        jogadores.push({ nome, nivel, nivelDefinido: usarNivel });
        salvarJogadores();
        
        nomeInput.value = "";
        document.getElementById("usarNivel").checked = false;
        toggleNivelSelect();
        renderJogadores();
    }

    function remover(i) {
        jogadores.splice(i, 1);
        salvarJogadores();
        renderJogadores();
    }

    function limparJogadores() {
        if (!confirm("Apagar tudo?")) return;
        jogadores = [];
        salvarJogadores();
        renderJogadores();
        document.getElementById("times").innerHTML = '';
    }

    function renderJogadores() {
        const lista = document.getElementById("listaJogadores");
        lista.innerHTML = "";

        jogadores.forEach((j, i) => {
            const labelNivel = j.nivelDefinido ? `Nível ${j.nivel}` : "Nível não definido";
            lista.innerHTML += `
                <div class="jogador-item">
                    <div>
                        <strong>${j.nome}</strong><br>
                        <span style="color: var(--text-muted); font-size: 0.8rem;">${labelNivel}</span>
                    </div>
                    <button class="btn-del" onclick="remover(${i})">✕</button>
                </div>
            `;
        });
        document.getElementById("totalJogadores").innerText = jogadores.length;
    }

    function sortear() {
        if (jogadores.length === 0) return alert("Adicione jogadores!");
        const numTimes = parseInt(document.getElementById("numTimes").value);
        
        // Embaralha e depois ordena pelo nível (quem não tem nível definido fica como 1)
        let lista = [...jogadores].sort(() => Math.random() - 0.5).sort((a, b) => b.nivel - a.nivel);
        let times = Array.from({ length: numTimes }, () => []);

        let i = 0, dir = 1;
        lista.forEach(j => {
            times[i].push(j);
            i += dir;
            if (i === numTimes) { dir = -1; i = numTimes - 1; }
            else if (i < 0) { dir = 1; i = 0; }
        });

        ultimoSorteio = times;
        renderTimes(times);
    }

    function renderTimes(times) {
        const div = document.getElementById("times");
        div.innerHTML = "";
        times.forEach((t, i) => {
            div.innerHTML += `
                <div class="time-box">
                    <h3 style="color: var(--primary)">Time ${i + 1}</h3>
                    ${t.map(j => `<p>• ${j.nome}</p>`).join("")}
                </div>
            `;
        });
    }

    function gerarTexto() {
        if (!ultimoSorteio.length) return alert("Sorteie primeiro!");
        let txt = "⚽ *TIMES DO RACHA* ⚽\n\n";
        ultimoSorteio.forEach((t, i) => {
            txt += `*TIME ${i + 1}*\n`;
            t.forEach(j => txt += `• ${j.nome}\n`);
            txt += "\n";
        });
        document.getElementById("textoTimes").value = txt;
        document.getElementById("modal").style.display = "block";
    }

    function copiarTexto() {
        const area = document.getElementById("textoTimes");
        area.select();
        document.execCommand("copy");
        alert("Copiado!");
    }

    function fecharModal() {
        document.getElementById("modal").style.display = "none";
    }

    window.onload = carregarJogadores;
</script>

</body>
</html>
