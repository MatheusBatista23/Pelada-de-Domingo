<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Montador de Times Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #1e252b;
            --bg-card: #2d3640;
            --primary: #22c55e;
            --primary-hover: #1aa14b;
            --danger: #ef4444;
            --text-main: #ffffff;
            --text-muted: #a0aec0;
            --border: #3f4a56;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg-body);
            color: var(--text-main);
            padding: 20px 15px;
            line-height: 1.5;
        }

        .container { max-width: 450px; margin: auto; }

        header { text-align: center; margin-bottom: 25px; }
        header h1 { font-size: 1.5rem; display: flex; align-items: center; justify-content: center; gap: 10px; }

        .card {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .card-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 15px;
            font-weight: 600;
        }

        label { display: block; font-size: 0.9rem; margin-bottom: 5px; color: var(--text-muted); }

        input, select {
            width: 100%;
            padding: 12px;
            background: #1e252b;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: white;
            font-size: 16px;
            margin-bottom: 15px;
            transition: border 0.3s;
        }

        input:focus { border-color: var(--primary); outline: none; }

        .grid-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

        button {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform 0.1s, opacity 0.2s;
        }

        button:active { transform: scale(0.98); }

        .btn-add { background: var(--primary); color: white; }
        .btn-sortear { background: var(--primary); color: white; margin-bottom: 10px; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-secondary { background: #4a5568; color: white; margin-top: 10px; }

        .action-row { display: grid; grid-template-columns: 1.5fr 1fr; gap: 10px; margin-bottom: 10px; }

        /* Lista de Jogadores Estilizada */
        .lista-container { max-height: 300px; overflow-y: auto; }
        .jogador-item {
            background: #1e252b;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid var(--primary);
        }
        .jogador-info span { color: var(--text-muted); font-size: 0.8rem; }
        .btn-del { 
            background: none; border: none; color: var(--danger); 
            width: auto; padding: 5px; font-size: 1.2rem;
        }

        /* Times Gerados */
        .time-box {
            background: #1e252b;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            border: 1px solid var(--border);
        }
        .time-box h3 { 
            font-size: 1rem; color: var(--primary); 
            border-bottom: 1px solid var(--border); 
            margin-bottom: 10px; padding-bottom: 5px;
        }
        .time-box p { font-size: 0.95rem; margin-bottom: 4px; }

        /* Modal */
        .modal {
            display: none; position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.85); z-index: 100;
        }
        .modal-content {
            background: var(--bg-card); margin: 15% auto; padding: 25px;
            width: 90%; max-width: 400px; border-radius: 15px;
        }
        textarea {
            width: 100%; height: 200px; background: #1e252b; border: 1px solid var(--border);
            color: white; border-radius: 8px; padding: 10px; margin: 15px 0; font-family: monospace;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>⚽ Montador de Times</h1>
    </header>

    <!-- CARD CADASTRO -->
    <div class="card">
        <p class="card-title">Adicionar Jogador</p>
        <input type="text" id="nome" placeholder="Nome do Jogador">
        <label>Nível de Habilidade</label>
        <select id="nivel">
            <option value="1">⭐ Nível 1 (Básico)</option>
            <option value="2">⭐⭐ Nível 2 (Intermediário)</option>
            <option value="3">⭐⭐⭐ Nível 3 (Craque)</option>
        </select>
        <button class="btn-add" onclick="addJogador()">Adicionar Jogador <span>+</span></button>
    </div>

    <!-- CARD CONFIG E SORTEIO -->
    <div class="card">
        <p class="card-title">Configurar Sorteio</p>
        <div class="grid-inputs">
            <div>
                <label>Qtd. Times</label>
                <input type="number" id="numTimes" value="2">
            </div>
            <div>
                <label>Jog. por Time</label>
                <input type="number" id="porTime" value="5">
            </div>
        </div>
        
        <div class="action-row">
            <button class="btn-sortear" onclick="sortear()">🎲 Sortear</button>
            <button class="btn-danger" onclick="limparJogadores()">🗑️ Limpar</button>
        </div>
        <button class="btn-secondary" onclick="gerarTexto()">📋 Gerar Texto para WhatsApp</button>
    </div>

    <!-- LISTA DE JOGADORES -->
    <div class="card">
        <p class="card-title">Jogadores Cadastrados (<span id="totalJogadores">0</span>)</p>
        <div id="listaJogadores" class="lista-container">
            <!-- Items via JS -->
        </div>
    </div>

    <!-- RESULTADO DOS TIMES -->
    <div class="card">
        <p class="card-title">Times Formados</p>
        <div id="times">
            <p style="color: var(--text-muted); text-align: center; font-size: 0.9rem;">Os times aparecerão aqui após o sorteio.</p>
        </div>
    </div>
</div>

<!-- MODAL -->
<div id="modal" class="modal">
    <div class="modal-content">
        <h3 style="color: var(--primary)">Lista para Copiar</h3>
        <textarea id="textoTimes" readonly></textarea>
        <button class="btn-add" onclick="copiarTexto()">Copiar Texto</button>
        <button class="btn-secondary" onclick="fecharModal()">Fechar</button>
    </div>
</div>

<script>
    let jogadores = [];
    let ultimoSorteio = [];

    function salvarJogadores() {
        localStorage.setItem("jogadores", JSON.stringify(jogadores));
    }

    function carregarJogadores() {
        const dados = localStorage.getItem("jogadores");
        if (dados) jogadores = JSON.parse(dados);
        renderJogadores();
    }

    function addJogador() {
        const nomeInput = document.getElementById("nome");
        const nome = nomeInput.value.trim();
        const nivel = parseInt(document.getElementById("nivel").value);

        if (!nome) return alert("Por favor, digite o nome do jogador.");

        jogadores.push({ nome, nivel });
        salvarJogadores();
        nomeInput.value = "";
        nomeInput.focus();
        renderJogadores();
    }

    function remover(i) {
        jogadores.splice(i, 1);
        salvarJogadores();
        renderJogadores();
    }

    function limparJogadores() {
        if (!confirm("Tem certeza que deseja apagar todos os jogadores?")) return;
        jogadores = [];
        salvarJogadores();
        renderJogadores();
        document.getElementById("times").innerHTML = '<p style="color: var(--text-muted); text-align: center; font-size: 0.9rem;">Os times aparecerão aqui após o sorteio.</p>';
    }

    function renderJogadores() {
        const lista = document.getElementById("listaJogadores");
        lista.innerHTML = "";

        jogadores.forEach((j, i) => {
            lista.innerHTML += `
                <div class="jogador-item">
                    <div class="jogador-info">
                        <strong>${j.nome}</strong><br>
                        <span>Nível ${j.nivel}</span>
                    </div>
                    <button class="btn-del" onclick="remover(${i})">✕</button>
                </div>
            `;
        });

        document.getElementById("totalJogadores").innerText = jogadores.length;
    }

    function sortear() {
        if (jogadores.length === 0) return alert("Adicione jogadores primeiro!");
        
        const numTimes = parseInt(document.getElementById("numTimes").value);
        let lista = [...jogadores].sort(() => Math.random() - 0.5).sort((a, b) => b.nivel - a.nivel);
        let times = Array.from({ length: numTimes }, () => []);

        let i = 0, dir = 1;
        lista.forEach(j => {
            times[i].push(j);
            i += dir;
            if (i === numTimes) { dir = -1; i = numTimes - 1; }
            else if (i < 0) { dir = 1; i = 0; }
        });

        ultimoSorteio = times;
        renderTimes(times);
    }

    function renderTimes(times) {
        const div = document.getElementById("times");
        div.innerHTML = "";

        times.forEach((t, i) => {
            div.innerHTML += `
                <div class="time-box">
                    <h3>Time ${i + 1}</h3>
                    ${t.map(j => `<p>• ${j.nome}</p>`).join("")}
                </div>
            `;
        });
    }

    function gerarTexto() {
        if (!ultimoSorteio.length) return alert("Sorteie os times primeiro!");

        let txt = "⚽ *EQUIPES FORMADAS* ⚽\n\n";
        ultimoSorteio.forEach((t, i) => {
            txt += `*TIME ${i + 1}*\n`;
            t.forEach(j => txt += `• ${j.nome}\n`);
            txt += "\n";
        });

        document.getElementById("textoTimes").value = txt;
        document.getElementById("modal").style.display = "block";
    }

    function copiarTexto() {
        const area = document.getElementById("textoTimes");
        area.select();
        document.execCommand("copy");
        alert("Texto copiado para a área de transferência!");
    }

    function fecharModal() {
        document.getElementById("modal").style.display = "none";
    }

    window.onload = carregarJogadores;
</script>

</body>
</html>
