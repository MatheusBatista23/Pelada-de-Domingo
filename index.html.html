<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Montador de Times</title>

  <style>
    body {
      font-family: Arial;
      background: #0f172a;
      color: white;
      padding: 20px;
    }

    h1 {
      text-align: center;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    input, select, button {
      padding: 8px;
      margin: 5px;
      border-radius: 6px;
      border: none;
    }

    button {
      cursor: pointer;
      background: #22c55e;
      color: white;
      font-weight: bold;
    }

    button:hover {
      background: #16a34a;
    }

    .danger {
      background: #ef4444;
    }

    .danger:hover {
      background: #dc2626;
    }

    .jogador {
      display: flex;
      justify-content: space-between;
      background: #1e293b;
      padding: 8px;
      margin-top: 5px;
      border-radius: 6px;
    }

    .times {
      margin-top: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
    }

    .time {
      background: #1e293b;
      padding: 10px;
      border-radius: 8px;
    }

    .time h3 {
      margin-bottom: 10px;
      border-bottom: 1px solid #334155;
      padding-bottom: 5px;
    }

    .top-controls {
      margin-bottom: 10px;
    }
  </style>
</head>

<body>

<div class="container">
  <h1>⚽ Montador de Times</h1>

  <!-- ADD JOGADOR -->
  <div class="top-controls">
    <input type="text" id="nome" placeholder="Nome do jogador">
    
    <select id="nivel">
      <option value="1">Nível 1</option>
      <option value="2">Nível 2</option>
      <option value="3">Nível 3</option>
    </select>

    <button onclick="addJogador()">Adicionar</button>
  </div>

  <!-- CONFIG -->
  <div>
    <label>Times:</label>
    <input type="number" id="numTimes" value="2" min="2">

    <label>Jogadores por time:</label>
    <input type="number" id="porTime" value="5" min="1">
  </div>

  <!-- AÇÕES -->
  <div style="margin-top:10px;">
    <button onclick="sortear()">🎲 Sortear Times</button>
    <button class="danger" onclick="limparJogadores()">🗑️ Apagar Todos</button>
  </div>

  <!-- LISTA -->
  <h2>Jogadores (<span id="totalJogadores">0</span>)</h2>
  <div id="listaJogadores"></div>

  <!-- TIMES -->
  <h2>Times</h2>
  <div class="times" id="times"></div>
</div>

<script>
let jogadores = [];

// ADICIONAR
function addJogador() {
  const nome = document.getElementById("nome").value.trim();
  const nivel = parseInt(document.getElementById("nivel").value);

  if (!nome) {
    alert("Digite um nome");
    return;
  }

  jogadores.push({ nome, nivel });

  document.getElementById("nome").value = "";
  renderJogadores();
}

// REMOVER
function remover(index) {
  jogadores.splice(index, 1);
  renderJogadores();
}

// LIMPAR TODOS
function limparJogadores() {
  if (!confirm("Tem certeza que deseja apagar todos os jogadores?")) return;

  jogadores = [];
  renderJogadores();
  document.getElementById("times").innerHTML = "";
}

// RENDER LISTA
function renderJogadores() {
  const lista = document.getElementById("listaJogadores");
  const total = document.getElementById("totalJogadores");

  lista.innerHTML = "";

  jogadores.forEach((j, i) => {
    lista.innerHTML += `
      <div class="jogador">
        ${j.nome} (Nível ${j.nivel})
        <button onclick="remover(${i})">❌</button>
      </div>
    `;
  });

  total.innerText = jogadores.length;
}

// SORTEIO BALANCEADO
function sortear() {
  const numTimes = parseInt(document.getElementById("numTimes").value);
  const porTime = parseInt(document.getElementById("porTime").value);

  if (jogadores.length < numTimes * porTime) {
    alert("Jogadores insuficientes!");
    return;
  }

  // Ordena por nível (maior primeiro)
  let lista = [...jogadores].sort((a, b) => b.nivel - a.nivel);

  let times = Array.from({ length: numTimes }, () => []);

  let index = 0;
  let direcao = 1;

  lista.forEach(j => {
    times[index].push(j);

    index += direcao;

    if (index === numTimes) {
      direcao = -1;
      index = numTimes - 1;
    } else if (index < 0) {
      direcao = 1;
      index = 0;
    }
  });

  renderTimes(times);
}

// RENDER TIMES
function renderTimes(times) {
  const div = document.getElementById("times");
  div.innerHTML = "";

  times.forEach((time, i) => {
    let total = time.reduce((s, j) => s + j.nivel, 0);

    div.innerHTML += `
      <div class="time">
        <h3>Time ${i + 1} (Força: ${total})</h3>
        ${time.map(j => `<p>${j.nome} (${j.nivel})</p>`).join("")}
      </div>
    `;
  });
}
</script>

</body>
</html>
